<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Đăng ký - PEESEE</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div id="header"></div>

    <main class="auth-page">
        <div class="auth-card">
            <h1>Đăng ký</h1>

            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="register-username">Tên đăng nhập</label>
                    <input type="text" id="register-username" placeholder="Nhập tên đăng nhập" required>
                </div>

                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="Nhập email" required>
                </div>

                <div class="form-group">
                    <label for="register-password">Mật khẩu</label>
                    <input type="password" id="register-password" placeholder="Nhập mật khẩu" required>
                </div>

                <div class="form-group">
                    <label for="register-confirm-password">Xác nhận mật khẩu</label>
                    <input type="password" id="register-confirm-password" placeholder="Nhập lại mật khẩu" required>
                </div>

                <button type="submit" class="auth-btn">Đăng ký</button>
            </form>

            <p class="auth-switch">
                Đã có tài khoản?
                <a href="login.html">Đăng nhập</a>
            </p>
        </div>
    </main>

    <div id="footer"></div>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>

</body>

</html>
